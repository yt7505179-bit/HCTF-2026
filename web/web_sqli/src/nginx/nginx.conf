worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4m;

    # 上游：应用后端（同容器 uvicorn）
    upstream backend_up { server 127.0.0.1:8000; }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- 认证票据服务（API 子路径精确转发）----
        location ^~ /lyuapServer/v1/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ^~ /lyuapServer/custom/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        location ^~ /lyuapServer/UKey/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        location ^~ /lyuapServer/wechatauz/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        # gohome.js 的 receiveLoginData 以带尾斜杠路径请求 loginType
        location = /lyuapServer/loginType {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        location = /lyuapServer/loginType/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        location = /lyuapServer/kaptcha {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }
        location ^~ /api/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
        }

        # ---- /lyuapServer/ 其余路径是 SPA 前端路由，回 index.html ----
        location /lyuapServer/ {
            try_files $uri /index.html;
        }

        # ---- /sc/ 业务前缀（门户 /sc/portal 在后端渲染）----
        location /sc/ {
            proxy_pass http://backend_up$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- 静态前端（单页应用）----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
